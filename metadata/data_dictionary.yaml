labels:
  Policy:
    description: 'Insurance policy - the anchor node. Carries premium, loss-ratio and claim ROLLUPS. Rollups: claim_count,
      open_claim_count, fraud_flagged_claim_count, total_claimed, total_approved, total_paid, total_outstanding,
      avg_settlement_days, renewal_count, event_count, vehicle_count, health_member_count, calculated_loss_ratio_pct.'
    properties:
      policy_id:
        description: policy id (string)
      policy_number:
        description: policy number (string)
      policy_type:
        description: policy type (string)
      main_type:
        description: main type (string)
      general_line_of_business:
        description: general line of business (string)
      line_of_business:
        description: health | motor | pc | ps (profile actual values).
      policy_status:
        description: policy status (string)
      is_active:
        description: True if the policy is currently in force. Use for 'active policies'.
      is_cancelled:
        description: True if cancelled. Pair with cancellation_reason.
      is_reinsured:
        description: is reinsured (boolean)
      is_direct:
        description: is direct (boolean)
      issue_date:
        description: issue date (datetime)
      effect_date:
        description: effect date (datetime)
      renewal_date:
        description: renewal date (datetime)
      expiry_date:
        description: expiry date (datetime)
      cancellation_date:
        description: cancellation date (datetime)
      cancellation_reason:
        description: cancellation reason (string)
      policy_term_days:
        description: policy term days (long)
      effect_year:
        description: effect year (long)
      effect_month:
        description: effect month (string)
      gross_written_premium:
        description: GWP in SAR, excl. tax. Premium is a property, NOT a node.
      net_written_premium:
        description: net written premium (double)
      commission:
        description: commission (double)
      reported_loss_ratio:
        description: Loss ratio as reported by the insurer.
      calculated_loss_ratio_pct:
        description: Loss ratio as a percent (claims paid / GWP * 100). 100 = break-even.
      product_count:
        description: product count (long)
      event_count:
        description: event count (long). Rollup - precomputed.
      last_event_type:
        description: last event type (string)
      renewal_count:
        description: Number of renewals. 'Renewed more than once' -> renewal_count > 1.
      claim_count:
        description: 'Rollup: number of claims under the policy.'
      open_claim_count:
        description: open claim count (long). Rollup - precomputed.
      fraud_flagged_claim_count:
        description: fraud flagged claim count (long). Rollup - precomputed.
      max_fraud_probability:
        description: max fraud probability (double)
      total_claimed:
        description: total claimed (double). Rollup - precomputed.
      total_approved:
        description: total approved (double). Rollup - precomputed.
      total_paid:
        description: 'Rollup: claims paid under the policy.'
      total_outstanding:
        description: total outstanding (double). Rollup - precomputed.
      avg_settlement_days:
        description: avg settlement days (double). Rollup - precomputed.
      vehicle_count:
        description: vehicle count (long). Rollup - precomputed.
      health_member_count:
        description: health member count (long). Rollup - precomputed.
      reinsurance_agreement_count:
        description: reinsurance agreement count (long)
  Insurer:
    description: 'Licensed insurance company. Rollups: saudization_pct, lines_of_business.'
    properties:
      insurer_id:
        description: insurer id (string)
      ia_id:
        description: ia id (string)
      name:
        description: name (string)
      name_arab:
        description: name arab (string)
      short_name:
        description: short name (string)
      cr_id:
        description: cr id (string)
      city:
        description: city (string)
      region:
        description: region (string)
      country:
        description: country (string)
      is_local:
        description: True for Saudi-domiciled insurers; false = foreign.
      is_health:
        description: is health (boolean)
      is_motor:
        description: is motor (boolean)
      is_p_c:
        description: is p c (boolean)
      is_p_s:
        description: is p s (boolean)
      lines_of_business:
        description: lines of business (string). Rollup - precomputed.
      employee_count:
        description: employee count (long)
      saudization_pct:
        description: Share of Saudi employees, percent.
      number_of_branches:
        description: number of branches (long)
  Reinsurer:
    description: Reinsurance company.
    properties:
      reinsurer_id:
        description: reinsurer id (string)
      ia_id:
        description: ia id (string)
      name:
        description: name (string)
      name_arab:
        description: name arab (string)
      country:
        description: country (string)
      is_local:
        description: is local (boolean)
  DistributionChannel:
    description: Broker / agency / TPA that sold the policy.
    properties:
      channel_id:
        description: channel id (string)
      name:
        description: name (string)
      name_arab:
        description: name arab (string)
      channel_type:
        description: broker | agency | tpa (profile).
      is_broker:
        description: is broker (boolean)
      is_agency:
        description: is agency (boolean)
      is_tpa:
        description: is tpa (boolean)
      is_local:
        description: is local (boolean)
      city:
        description: city (string)
      region:
        description: region (string)
      country:
        description: country (string)
  Agent:
    description: Individual agent working for a channel. Not linked to policies (source gap).
    properties:
      agent_id:
        description: agent id (string)
      name:
        description: name (string)
      employment_type:
        description: employment type (string)
      specialization:
        description: specialization (string)
      years_of_experience:
        description: years of experience (long)
      hired_date:
        description: hired date (datetime)
  Product:
    description: Insurer's commercial product, mapped to an IA product.
    properties:
      product_mapping_id:
        description: product mapping id (string)
      name:
        description: name (string)
      ia_product_name:
        description: ia product name (string)
      is_active:
        description: is active (boolean)
      approval_date:
        description: approval date (date)
      end_date:
        description: end date (date)
  IAProduct:
    description: Product in the Insurance Authority catalogue.
    properties:
      insurance_authority_product_id:
        description: insurance authority product id (string)
      name:
        description: name (string)
  Policyholder:
    description: Party holding a policy - individual OR organisation (policyholder_type).
    pii:
    - identity_number
    - phone
    - email
    - date_of_birth
    - vat_no
    properties:
      policyholder_sk:
        description: policyholder sk (string)
      name:
        description: name (string)
      policyholder_type:
        description: individual | organisation (profile).
      lob:
        description: lob (string)
      identity_type:
        description: identity type (string)
      identity_number:
        description: identity number (string)
      cr_id:
        description: cr id (string)
      vat_no:
        description: vat no (string)
      gender:
        description: gender (string)
      date_of_birth:
        description: date of birth (datetime)
      nationality:
        description: nationality (string)
      city:
        description: city (string)
      region:
        description: region (string)
      country:
        description: country (string)
      employee_count:
        description: employee count (long)
      phone:
        description: phone (string)
      email:
        description: email (string)
      source_table:
        description: source table (string)
      source_id:
        description: source id (long)
  HealthMember:
    description: 'Health-insured person (primary or dependent). Rollups: age_years.'
    pii:
    - date_of_birth
    - beneficiary_number
    properties:
      member_id:
        description: member id (string)
      beneficiary_number:
        description: beneficiary number (string)
      is_primary:
        description: is primary (boolean)
      is_policyholder:
        description: is policyholder (boolean)
      relationship_with_primary:
        description: self | spouse | child ... (profile).
      gender:
        description: gender (string)
      date_of_birth:
        description: date of birth (date)
      age_years:
        description: Age in years, precomputed. Use instead of date_of_birth arithmetic.
      nationality:
        description: nationality (string)
      city:
        description: city (string)
      marital_status:
        description: marital status (string)
      employment_status:
        description: employment status (string)
      inception_date_for_member:
        description: inception date for member (datetime)
      policy_product_id:
        description: policy product id (long)
  BenefitClass:
    description: Benefit tier of a health member (e.g. VIP, A, B).
    properties:
      class_id:
        description: class id (string)
      name:
        description: name (string)
      class_type:
        description: class type (string)
      class_status:
        description: class status (string)
  Vehicle:
    description: Insured vehicle.
    pii:
    - license_plate_number
    - chassis_number
    properties:
      vehicle_id:
        description: vehicle id (string)
      license_plate_number:
        description: license plate number (string)
      plate_type_eng:
        description: plate type eng (string)
      chassis_number:
        description: chassis number (string)
      manufacturer:
        description: manufacturer (string)
      vehicle_model:
        description: vehicle model (string)
      vehicle_model_year:
        description: vehicle model year (long)
      year_manufactured:
        description: year manufactured (long)
      vehicle_type:
        description: vehicle type (string)
      usage_type:
        description: usage type (string)
      coverage_type:
        description: coverage type (string)
      seat_number:
        description: seat number (long)
      region_registration:
        description: region registration (string)
      is_ev:
        description: True for electric vehicles.
      ai_assisted_driving_function:
        description: True if the vehicle has AI-assisted driving.
      is_new_vehicle:
        description: is new vehicle (boolean)
      is_corporate:
        description: is corporate (boolean)
      is_imported:
        description: is imported (boolean)
      is_non_claim_discount_applied:
        description: is non claim discount applied (boolean)
      effect_date_for_vehicle:
        description: effect date for vehicle (datetime)
      policy_product_id:
        description: policy product id (long)
  Claim:
    description: 'Claim under a policy. Carries health/motor ROLLUPS (settlement_days, days_into_policy, repair
      cost, shares). Rollups: settlement_days, days_into_policy, claim_year, claim_month, is_open, approval_rate_pct,
      paid_rate_pct, health_net_amount, patient_share_amount, payer_share_amount, est_total_repair_cost_with_vat,
      diagnosis_codes, damage_types, pre_auth_count.'
    properties:
      claim_id:
        description: claim id (string)
      claim_number:
        description: claim number (string)
      claim_lob:
        description: Line of business of the claim.
      claim_status:
        description: claim status (string)
      is_open:
        description: True while the claim is unresolved.
      adjudication_outcome:
        description: adjudication outcome (string)
      claim_source:
        description: claim source (string)
      claim_creation_date:
        description: claim creation date (datetime)
      claim_year:
        description: claim year (long). Rollup - precomputed.
      claim_month:
        description: claim month (string). Rollup - precomputed.
      claim_resolution_date:
        description: claim resolution date (datetime)
      last_payment_date:
        description: last payment date (datetime)
      settlement_days:
        description: Days from creation to resolution. Use for 'settlement time'.
      days_into_policy:
        description: Days between policy effect date and claim creation. 'Claims within 30 days of policy start'
          -> <= 30.
      claimed_amount:
        description: claimed amount (double)
      approved_amount:
        description: approved amount (double)
      amount_paid:
        description: amount paid (double)
      amount_rejected:
        description: amount rejected (double)
      amount_outstanding:
        description: amount outstanding (double)
      copay_amount:
        description: copay amount (double)
      deductible_applied:
        description: deductible applied (double)
      tax:
        description: tax (double)
      approval_rate_pct:
        description: approval rate pct (double). Rollup - precomputed.
      paid_rate_pct:
        description: paid rate pct (double). Rollup - precomputed.
      rejection_reason:
        description: rejection reason (string)
      fraud_suspicion_indicator:
        description: True if flagged as suspected fraud.
      fraud_probability:
        description: Fraud score 0-100 (percent). '0.8' from a user means 80.
      pre_auth_count:
        description: pre auth count (long). Rollup - precomputed.
      pre_auth_requested:
        description: pre auth requested (double)
      pre_auth_approved:
        description: pre auth approved (double)
      service_line_count:
        description: service line count (long)
      health_net_amount:
        description: health net amount (double). Rollup - precomputed.
      patient_share_amount:
        description: patient share amount (double). Rollup - precomputed.
      payer_share_amount:
        description: payer share amount (double). Rollup - precomputed.
      diagnosis_codes:
        description: diagnosis codes (string). Rollup - precomputed.
      accident_count:
        description: accident count (long)
      damage_assessment_count:
        description: damage assessment count (long)
      est_total_repair_cost_with_vat:
        description: 'Rollup: total damage-assessment cost for motor claims.'
      damage_types:
        description: damage types (string). Rollup - precomputed.
      total_injuries:
        description: total injuries (double)
      total_fatalities:
        description: total fatalities (double)
  Claimant:
    description: Party that filed the claim.
    pii:
    - claimant_identity_number
    properties:
      claimant_id:
        description: claimant id (string)
      claimant_type:
        description: claimant type (string)
      claimant_identity_type:
        description: claimant identity type (string)
      claimant_identity_number:
        description: claimant identity number (string)
  PreAuthorization:
    description: Prior approval of a health service. Reached ONLY via Claim-[:HAS_PRE_AUTH].
    properties:
      pre_authorization_id:
        description: pre authorization id (string)
      pre_authorization_number:
        description: pre authorization number (string)
      pre_authorization_status:
        description: pre authorization status (string)
      adjudication_outcome:
        description: adjudication outcome (string)
      pre_authorization_creation_date:
        description: pre authorization creation date (datetime)
      pre_authorization_amount:
        description: pre authorization amount (double)
      approved_amount:
        description: approved amount (double)
      amount_rejected:
        description: amount rejected (double)
      fraud_suspicion_indicator:
        description: fraud suspicion indicator (boolean)
      fraud_probability:
        description: fraud probability (double)
  HealthClaimLine:
    description: Line item of a health claim.
    properties:
      health_claim_id:
        description: health claim id (string)
      claim_type:
        description: claim type (string)
      sub_type:
        description: sub type (string)
      product_service:
        description: product service (string)
      service_date:
        description: service date (datetime)
      quantity:
        description: quantity (long)
      unit_price:
        description: unit price (double)
      net_amount:
        description: net amount (double)
      tax_amount:
        description: tax amount (double)
      patient_share_amount:
        description: patient share amount (double)
      payer_share_amount:
        description: payer share amount (double)
      currency:
        description: currency (string)
  DiagnosisCode:
    description: Diagnosis code on a claim line.
    properties:
      code:
        description: code (string)
  Accident:
    description: Motor accident behind a claim.
    properties:
      accident_id:
        description: accident id (string)
      accident_case_number:
        description: accident case number (string)
      accident_datetime:
        description: accident datetime (datetime)
      city:
        description: city (string)
      latitude:
        description: latitude (double)
      longitude:
        description: longitude (double)
      source:
        description: source (string)
      parties_count:
        description: parties count (long)
      injury_count:
        description: injury count (long)
      fatality_count:
        description: Number of fatalities in the accident.
  DamageAssessment:
    description: Repair-cost estimate for an accident.
    properties:
      damage_assessment_id:
        description: damage assessment id (string)
      da_center:
        description: da center (string)
      center_city:
        description: center city (string)
      damage_type:
        description: damage type (string)
      da_initiated_date:
        description: da initiated date (datetime)
      da_completed_date:
        description: da completed date (datetime)
      labor_cost:
        description: labor cost (double)
      spare_parts_cost:
        description: spare parts cost (double)
      total_cost_with_vat:
        description: Estimated repair cost incl. VAT.
  PolicyEvent:
    description: Lifecycle event of a policy.
    properties:
      policy_event_id:
        description: policy event id (string)
      event_type:
        description: event type (string)
      event_date:
        description: event date (datetime)
      event_status:
        description: event status (string)
      reason:
        description: reason (string)
      triggered_by:
        description: triggered by (string)
relationships:
  ISSUED_BY:
    description: Policy issued by Insurer.
    from: Policy
    to: Insurer
    example: MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer)
  SOLD_VIA:
    description: Policy sold via DistributionChannel.
    from: Policy
    to: DistributionChannel
    example: MATCH (p:Policy)-[:SOLD_VIA]->(d:DistributionChannel)
  HAS_PRODUCT:
    description: Policy has product Product.
    from: Policy
    to: Product
    example: MATCH (p:Policy)-[x:HAS_PRODUCT]->(pr:Product)
    properties:
      policy_product_id:
        description: policy product id (long)
  REINSURED_BY:
    description: reinsurance agreement lives on the edge
    from: Policy
    to: Reinsurer
    example: MATCH (p:Policy)-[x:REINSURED_BY]->(r:Reinsurer)
    properties:
      agreement_id:
        description: agreement id (long)
      agreement_type:
        description: agreement type (string)
      coverage_type:
        description: coverage type (string)
      quota_share_percentage:
        description: quota share percentage (double)
      excess_of_loss_limit:
        description: excess of loss limit (double)
      effective_date:
        description: effective date (datetime)
      expiry_date:
        description: expiry date (datetime)
  HAS_EVENT:
    description: Policy has event PolicyEvent.
    from: Policy
    to: PolicyEvent
    example: MATCH (p:Policy)-[:HAS_EVENT]->(po:PolicyEvent)
  REGULATED_AS:
    description: Product regulated as IAProduct.
    from: Product
    to: IAProduct
    example: MATCH (p:Product)-[:REGULATED_AS]->(i:IAProduct)
  WORKS_FOR:
    description: Agent works for DistributionChannel.
    from: Agent
    to: DistributionChannel
    example: MATCH (a:Agent)-[:WORKS_FOR]->(d:DistributionChannel)
  COVERED_BY:
    description: HealthMember covered by Policy.
    from: HealthMember
    to: Policy
    example: MATCH (h:HealthMember)-[:COVERED_BY]->(p:Policy)
  SPONSORED_BY:
    description: employer / sponsoring organisation
    from: HealthMember
    to: Policyholder
    example: MATCH (h:HealthMember)-[:SPONSORED_BY]->(p:Policyholder)
  IN_CLASS:
    description: HealthMember in class BenefitClass.
    from: HealthMember
    to: BenefitClass
    example: MATCH (h:HealthMember)-[:IN_CLASS]->(b:BenefitClass)
  INSURED_UNDER:
    description: Vehicle insured under Policy.
    from: Vehicle
    to: Policy
    example: MATCH (v:Vehicle)-[:INSURED_UNDER]->(p:Policy)
  OWNED_BY:
    description: Vehicle owned by Policyholder.
    from: Vehicle
    to: Policyholder
    example: MATCH (v:Vehicle)-[:OWNED_BY]->(p:Policyholder)
  UNDER_POLICY:
    description: ~10% of claims have no policy edge
    from: Claim
    to: Policy
    example: MATCH (c:Claim)-[x:UNDER_POLICY]->(p:Policy)
    properties:
      policy_product_id:
        description: policy product id (long)
  FOR_PRODUCT:
    description: Claim for product Product.
    from: Claim
    to: Product
    example: MATCH (c:Claim)-[:FOR_PRODUCT]->(p:Product)
  FILED_BY:
    description: Claim filed by Claimant.
    from: Claim
    to: Claimant
    example: MATCH (c:Claim)-[:FILED_BY]->(cl:Claimant)
  HAS_PRE_AUTH:
    description: Claim has pre auth PreAuthorization.
    from: Claim
    to: PreAuthorization
    example: MATCH (c:Claim)-[:HAS_PRE_AUTH]->(p:PreAuthorization)
  HAS_SERVICE_LINE:
    description: Claim has service line HealthClaimLine.
    from: Claim
    to: HealthClaimLine
    example: MATCH (c:Claim)-[:HAS_SERVICE_LINE]->(h:HealthClaimLine)
  INVOLVES_ACCIDENT:
    description: Claim involves accident Accident.
    from: Claim
    to: Accident
    example: MATCH (c:Claim)-[:INVOLVES_ACCIDENT]->(a:Accident)
  DIAGNOSED_WITH:
    description: HealthClaimLine diagnosed with DiagnosisCode.
    from: HealthClaimLine
    to: DiagnosisCode
    example: MATCH (h:HealthClaimLine)-[:DIAGNOSED_WITH]->(d:DiagnosisCode)
  ASSESSED_BY:
    description: Accident assessed by DamageAssessment.
    from: Accident
    to: DamageAssessment
    example: MATCH (a:Accident)-[:ASSESSED_BY]->(d:DamageAssessment)
schema_notes:
  rollups: Policy and Claim carry precomputed rollups (claim_count, total_paid, settlement_days, days_into_policy,
    calculated_loss_ratio_pct, renewal_count, is_active, is_open). ALWAYS use the flat property for policy/claim-level
    totals; traverse only for per-entity breakdowns.
  premium: Premium is Policy.gross_written_premium - there is NO Premium node.
  claims_to_insurer: (Claim)-[:UNDER_POLICY]->(Policy)-[:ISSUED_BY]->(Insurer). ~10% of claims have no UNDER_POLICY
    edge.
  pre_auth: 'PreAuthorization hangs off Claim only: (c:Claim)-[:HAS_PRE_AUTH]->(pa). Never from Policy.'
  policyholder: 'One Policyholder label for individuals and organisations (policyholder_type). Motor: (Vehicle)-[:OWNED_BY]->(Policyholder).
    Health sponsor: (HealthMember)-[:SPONSORED_BY]->(Policyholder).'
  dates: 'DateTime props: dot notation (p.issue_date.year) and compare with datetime(). Date props (HealthMember.date_of_birth,
    Product.approval_date, Product.end_date) compare with date().'
  geography: No City/Region nodes. city/region are strings on Insurer, DistributionChannel, Policyholder, HealthMember,
    Accident, DamageAssessment.center_city.
  fraud_scale: fraud_probability is 0-100. A user saying 'above 0.8' means > 80.
  age: HealthMember.age_years is precomputed - never compute from date_of_birth.
common_paths:
  claim_to_insurer: MATCH (c:Claim)-[:UNDER_POLICY]->(p:Policy)-[:ISSUED_BY]->(i:Insurer)
  policy_to_ia_product: MATCH (p:Policy)-[:HAS_PRODUCT]->(pr:Product)-[:REGULATED_AS]->(ia:IAProduct)
  motor_owner: MATCH (v:Vehicle)-[:INSURED_UNDER]->(p:Policy)-[:ISSUED_BY]->(i:Insurer), (v)-[:OWNED_BY]->(ph:Policyholder)
  member_to_insurer: MATCH (m:HealthMember)-[:COVERED_BY]->(p:Policy)-[:ISSUED_BY]->(i:Insurer)
  member_sponsor: MATCH (m:HealthMember)-[:SPONSORED_BY]->(ph:Policyholder)
  claim_diagnosis: MATCH (c:Claim)-[:HAS_SERVICE_LINE]->(l:HealthClaimLine)-[:DIAGNOSED_WITH]->(d:DiagnosisCode)
  claim_repair_cost: MATCH (c:Claim)-[:INVOLVES_ACCIDENT]->(a:Accident)-[:ASSESSED_BY]->(d:DamageAssessment)
  pre_auth: MATCH (c:Claim)-[:HAS_PRE_AUTH]->(pa:PreAuthorization)   // no Policy edge on PreAuthorization
  reinsurance_terms: MATCH (p:Policy)-[x:REINSURED_BY]->(r:Reinsurer)  // x.agreement_type, x.quota_share_percentage
  time_series_monthly: MATCH (p:Policy) WHERE p.issue_date IS NOT NULL RETURN p.issue_date.year AS yr, p.issue_date.month
    AS mo, count(p) AS n ORDER BY yr, mo
