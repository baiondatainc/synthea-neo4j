# dictionary_overrides.yaml — curated meaning for the Future Advisor (DoF) graph.
# Matches the graph AS IMPORTED on 2026-10-18: labels Kpi, Series, KpiObservation, Source, Country,
# relationships FOR_KPI, FOR_SOURCE, FOR_COUNTRY, FOR_CODE, FOR_DRIVER, FOR_CYCLE.
# If you re-import with the corrected graph_map.yaml (KPI, OF_KPI, SOURCED_FROM ...), rename here too;
# catalog_agent.py drops any path or example that names a label or type the live graph lacks.
# Numbers never go in this file.

base_model: qwen3:4b-instruct-2507-q4_K_M

token_budget:
  schema_char_budget: 7000
  min_rel_budget: 250
  min_path_budget: 200
  max_values_shown: 4
  max_prop_desc_chars: 80

llm_context: >
  Series nodes are SUMMARIES of a time series kept in PostgreSQL (n_points, first/last period, latest,
  min, max, mean); `table` names the Postgres table and `measure` the indicator or metric. Kpi nodes define
  macro indicators. Country codes are ISO alpha-3 (ARE, SAU, USA, GBR, CHN, IND ... plus IMF aggregates ADVANCED, EMERGING, DEVELOPING). Dubai fiscal series come from
  gold.de_* tables and have no country. Fiscal values are AED millions.

# ── Labels ──────────────────────────────────────────────────────────────────
labels:
  Kpi:
    description: "Macro indicator definition: code, name, unit, frequency, category. Values are NOT here; they are on KpiObservation and summarised on Series."
    properties:
      code: {description: "Indicator code, e.g. gdp_real_growth, cpi_yoy, policy_rate, oil_brent_spot, bond_yield_10y."}
      unit: {description: "pct | pct_gdp | usd | usd_bbl | index | persons | rate | AED_m."}
      frequency: {description: "annual | monthly | quarterly | daily."}
      category: {description: "macro | prices | tourism | macro_external | fiscal."}
  Country:
    description: "Country or area by ISO alpha-3 code: ARE United Arab Emirates (Dubai macro), SAU Saudi Arabia, USA United States, GBR, CHN, IND, DEU, JPN ...; IMF aggregates ADVANCED, EMERGING, DEVELOPING and regional groups (WEQ, EEQ, SAQ ...)."
    properties:
      code: {description: "ISO alpha-3 or IMF aggregate code."}
  Source:
    description: "Data publisher or internal system: IMF_WEO, WB_WDI, WB_DATA360, FRED (US), EIA (oil), BIS_CBPOL (policy rates), OECD_MEI (CPI), ECB, DSC (Dubai Statistics Centre), DET, DOF budget book."
    properties:
      code: {description: "Source code, e.g. IMF_WEO, FRED, DSC."}
      tier: {description: "T1 official statistics, T2 secondary, T3 derived."}
      kind: {description: "api | portal | file | dubai_fiscal | external_api."}
      last_status: {description: "Result of the last ingest run."}
      next_expected_release: {description: "Next expected publication date (release calendar)."}
      enabled: {description: "False when the source is switched off."}
  Series:
    description: "Summary of ONE time series. External macro: table gold.gold_* with country_code and measure (= Kpi.code). Dubai fiscal: table gold.de_* with series_group / entity_code / account_code / cofog_code / sector_code / driver_group / metric and no country. Values stay in PostgreSQL."
    properties:
      table: {description: "PostgreSQL table: gold.gold_imf_weo, gold.gold_fred, gold.gold_eia, gold.gold_bis_cbpol, gold.gold_oecd_mei, gold.gold_ecb, gold.gold_wb_wdi, gold.gold_wb_data360, gold.de_fiscal_history, gold.de_revenue_entity, gold.de_revenue_account, gold.de_expenditure_entity, gold.de_cofog, gold.de_gdp_sector, gold.de_driver, gold.de_macro_baseline, gold.de_scenario_line, gold.de_scenario_macro, gold.de_measure_impact."}
      measure: {description: "Indicator / metric code of the series (external: Kpi.code; Dubai: value_aed_m, budget_aed_m, actual_aed_m, recurrent_aed_m, capital_aed_m, real_aed_m, nominal_aed_m, employment ...)."}
      country_code: {description: "ISO code for external series (ARE, SAU, USA, GBR, CHN, IND ... plus IMF aggregates ADVANCED, EMERGING, DEVELOPING); null for Dubai fiscal series."}
      economy_group: {description: "IMF grouping (EM, AE) when present."}
      series_group: {description: "Dubai fiscal history group: 'Total revenue' | 'Total expenditure'."}
      entity_code: {description: "Dubai government entity code (E01 RTA, E02 DEWA, E03 DHA ...) for revenue/expenditure by entity."}
      account_code: {description: "Revenue account (A1 Fees, A2 VAT share ...)."}
      cofog_code: {description: "COFOG function (07 Health, 09 Education ...)."}
      sector_code: {description: "ISIC section for GDP by sector (G wholesale & retail, I accommodation ...)."}
      driver_group: {description: "Driver family for scenario drivers (oil_price, partner_demand ...)."}
      metric: {description: "Metric name for long-format series (level, value, employment ...)."}
      n_points: {description: "Number of observations."}
      first_period: {description: "First period 'YYYY-MM-DD' (string)."}
      last_period: {description: "Last period 'YYYY-MM-DD' (string); projections may run past today."}
      latest_value: {description: "Value at last_period, in the indicator's unit."}
      min_value: {description: "Minimum over the series."}
      max_value: {description: "Maximum over the series."}
      mean_value: {description: "Mean over the series."}
      has_points: {description: "True when the full path is on the node (periods / values arrays, series of at most 400 points)."}
      periods: {description: "Array of period strings 'YYYY-MM-DD', oldest first (only when has_points)."}
      values: {description: "Array of values aligned with periods (only when has_points)."}
  KpiObservation:
    description: "A single ingested indicator value for a country and period from a source (the point data behind external Series)."
    properties:
      kpi_code: {description: "Indicator code (= Kpi.code)."}
      geo: {description: "ISO alpha-3 country code (ARE, SAU, USA ...)."}
      period: {description: "Observation period (native date)."}
      value: {description: "Value in the Kpi unit."}
      source_code: {description: "Publisher code (= Source.code)."}
      confidence: {description: "Parser confidence 0-1."}
      validated: {description: "True once accepted."}
  KpiObservationRevision:
    description: "Audit row when a later vintage revised a value: old_value → new_value for a kpi, geo and period."
  Dataset:
    description: "Gold dataset registered from a source: table_name, kpi_codes, period range, row and geo counts."
  Document:
    description: "Publication fetched from a source (PDF/CSV) with parse status."
  IngestRun:
    description: "One ingestion job for a source: mode, trigger, status, rows fetched / inserted / updated / revised."
  DeMeasure:
    description: "Dubai policy measure (fee change, new fee, stimulus) that can be switched on in a scenario."
  DeScenarioDriver:
    description: "Driver the scenario builder can move (code, label, unit, min/max/step), e.g. oil price, partner growth, US rate."
  DeScenarioDriverValue:
    description: "Value of a driver under a named scenario (baseline, downside ...)."
  DeScenarioElasticity:
    description: "Elasticity of a fiscal line to a driver (line_name, driver_code, elasticity)."
  DeSource:
    description: "Dubai fiscal data source level (L1 statistics centre, L2 DoF budget book) and what it provides."
  ScenarioEngineRun: {description: "Scenario-engine execution with preset, overrides, focus year, created_by."}
  ScenarioEngineConfig: {description: "Versioned scenario-engine configuration (is_current)."}
  FiscalForecastConfig: {description: "Versioned fiscal-forecast configuration."}
  BacktestRun: {description: "Walk-forward backtest execution: target_id, variant_id, metrics (MAPE, bias), folds."}
  BacktestConfig: {description: "Versioned backtest configuration."}
  BspCycle: {description: "One annual Budget Strategy Paper cycle."}
  BspStage: {description: "Stage of a BSP cycle (M1-M5): number, milestone, owner, due_at, status, rework_loops."}
  User: {description: "Platform user (analyst, reviewer)."}
  PrismaMigrations: {description: "Database migration log — not business data; never query."}

# ── Relationships ───────────────────────────────────────────────────────────
relationships:
  FOR_KPI:     {description: "Observation / revision is for this Kpi."}
  FOR_COUNTRY: {description: "Series / observation is for this Country."}
  FOR_SOURCE:  {description: "Observation / document / dataset / ingest run comes from this Source."}
  FOR_CODE:    {description: "Driver value belongs to this scenario driver."}
  FOR_DRIVER:  {description: "Elasticity is on this scenario driver."}
  FOR_CYCLE:   {description: "Stage belongs to this BSP cycle."}

# ── Keywords (en + ar) → label ──────────────────────────────────────────────
label_keywords:
  Kpi: [kpi, indicator, indicators, definition, unit, frequency, المؤشر, الوحدة]
  Country: [country, countries, uae, emirates, dubai, saudi, us, usa, united states, america, euro, europe, world, الإمارات, دبي, السعودية, أمريكا, الولايات المتحدة]
  Source: [source, sources, publisher, imf, world bank, fred, eia, bis, oecd, ecb, dsc, statistics centre, budget book, المصدر, صندوق النقد, البنك الدولي]
  Series: [series, latest, last period, range, history, trend, gdp, growth, inflation, cpi, unemployment, population, oil, brent, wti, policy rate, interest rate, fed, bond yield, treasury, dollar, dollar index, fx, exchange rate, revenue, expenditure, spending, fees, vat, customs, entity, cofog, health, education, sector, tourism, trade, driver, baseline, scenario path, الناتج, النمو, التضخم, البطالة, النفط, سعر الفائدة, الإيرادات, النفقات, القطاع, السيناريو]
  KpiObservation: [observation, observations, data point, value in, recorded, confidence, validated, المشاهدة, القيمة]
  KpiObservationRevision: [revision, revisions, revised, old value, new value, vintage, المراجعة]
  Dataset: [dataset, datasets, table, coverage, row count, مجموعة البيانات]
  Document: [document, documents, publication, pdf, parse, الوثيقة]
  IngestRun: [ingest, ingestion, load, fetched, overdue, failed, last run, الاستيراد]
  DeMeasure: [measure, measures, policy measure, fee change, stimulus, الإجراء]
  DeScenarioDriver: [driver, drivers, lever, levers, المحرك]
  DeScenarioDriverValue: [driver value, under scenario, downside, baseline value]
  DeScenarioElasticity: [elasticity, elasticities, sensitivity, beta, المرونة]
  DeSource: [dubai source, fiscal source, level]
  ScenarioEngineRun: [engine run, scenario run, preset, focus year]
  BacktestRun: [backtest, backtests, mape, accuracy, variant]
  BspCycle: [bsp, budget strategy paper, cycle, الورقة الاستراتيجية]
  BspStage: [stage, stages, milestone, m1, m2, m3, m4, m5, due, owner, المرحلة]
  User: [user, users, analyst, reviewer]

path_keywords:
  external_series: [latest, value of, history of, in uae, in the us, for saudi, since, range]
  observations: [observation, data point, recorded, this year, by period, confidence]
  dubai_fiscal: [total revenue, total expenditure, by entity, by account, by function, cofog, sector]
  source_health: [overdue, failed, last fetched, source status, ingest]
  drivers_scenarios: [driver, scenario, downside, baseline, elasticity]

# ── Notes the Cypher model must respect ─────────────────────────────────────
schema_notes:
  series_values: "Series nodes carry a summary (n_points, first_period, last_period, latest_value, min_value, max_value, mean_value) and, when has_points = true (annual, quarterly, monthly series up to 400 points), the full path as parallel arrays periods[] and values[]. Daily series (FRED, EIA) have has_points = false: the path is in PostgreSQL."
  clock: "Today is date(); the current year is date().year. 'Last N years' means substring(period, 0, 4) >= toString(date().year - N). IMF series run past today (projections to date().year + 5)."
  trends: "For a trend / history / year-by-year question: filter the Series, then UNWIND range(0, size(s.periods) - 1) AS i and RETURN s.periods[i] AS period, s.values[i] AS value. Filter years with substring(s.periods[i], 0, 4) >= '2015'. Always add WHERE s.has_points = true."
  external_vs_dubai: "External macro series: s.country_code and s.measure (= Kpi.code), s.table STARTS WITH 'gold.gold_'. Dubai fiscal series: s.table STARTS WITH 'gold.de_', no country_code; filter on series_group / entity_code / account_code / cofog_code / sector_code / driver_group."
  no_series_kpi_edge: "There is NO edge from Series to Kpi. Join on code: MATCH (s:Series), (k:Kpi) WHERE s.measure = k.code. KpiObservation DOES have FOR_KPI."
  countries: "Country.code and KpiObservation.geo are ISO alpha-3: 'ARE' UAE / Dubai macro, 'SAU' Saudi Arabia, 'USA' United States, 'GBR' UK, 'CHN' China, 'IND' India, 'DEU' Germany, 'JPN' Japan. IMF aggregates: 'ADVANCED', 'EMERGING', 'DEVELOPING'. Never use 'AE', 'US', 'SA', 'UAE', 'Dubai', 'America' as codes. Oil series (EIA) carry no meaningful country: filter on measure only."
  us_sources: "US rates and dollar: gold.gold_fred (policy_rate, bond_yield_10y, fx_usd_index, country USA). US CPI monthly: gold.gold_oecd_mei. US GDP, inflation, unemployment annual: gold.gold_imf_weo with country_code 'USA'."
  uae_sources: "UAE macro: gold.gold_imf_weo (country_code 'ARE'), gold.gold_wb_wdi, gold.gold_wb_data360, gold.gold_bis_cbpol (policy_rate ARE). Dubai fiscal: gold.de_* tables."
  units: "Macro series use the Kpi unit (pct, pct_gdp, usd, usd_bbl, index). Dubai fiscal series are AED millions (measure ends in _aed_m)."
  periods: "Series.first_period / last_period are strings 'YYYY-MM-DD': year = substring(s.last_period, 0, 4). KpiObservation.period is a native date: o.period.year."
  provenance: "Always return the provenance next to the value: s.table, s.last_period (Series) or o.source_code, o.period (observations)."
  no_numbers_from_memory: "Never put a number in the query that the user did not say; never answer from memory."

common_paths:
  external_series: "MATCH (s:Series)-[:FOR_COUNTRY]->(c:Country {code: 'ARE'}) WHERE s.measure = 'gdp_real_growth' RETURN s.table, s.last_period, s.latest_value"
  series_with_unit: "MATCH (s:Series)-[:FOR_COUNTRY]->(c:Country), (k:Kpi) WHERE s.measure = k.code RETURN c.code, k.code, k.unit, s.latest_value"
  observations: "MATCH (o:KpiObservation)-[:FOR_KPI]->(k:Kpi), (o)-[:FOR_COUNTRY]->(c:Country) RETURN c.code, k.code, o.period, o.value, o.source_code"
  dubai_fiscal: "MATCH (s:Series) WHERE s.table STARTS WITH 'gold.de_' RETURN s.table, s.series_group, s.entity_code, s.measure, s.latest_value"
  source_health: "MATCH (i:IngestRun)-[:FOR_SOURCE]->(src:Source) RETURN src.code, i.status, i.finished_at, i.rows_inserted"
  drivers_scenarios: "MATCH (v:DeScenarioDriverValue)-[:FOR_CODE]->(d:DeScenarioDriver) RETURN v.scenario, d.code, d.label, v.value, d.unit"
  elasticities: "MATCH (e:DeScenarioElasticity)-[:FOR_DRIVER]->(d:DeScenarioDriver) RETURN e.line_name, d.code, e.elasticity"
  bsp: "MATCH (st:BspStage)-[:FOR_CYCLE]->(cy:BspCycle) RETURN cy.name, st.number, st.milestone, st.owner, st.due_at, st.status"

