# ---------------------------------------------------------------------------
# IA Knowledge Graph - text2cypher regression questions
# Ground-truth Cypher targets the v2 model (ia_data_dictionary.yaml).
#
# compare modes
#   count     single number (first row, first column)         tolerance = absolute
#   value     single row, values compared column-agnostic
#   rows      multiset of rows, column order/name agnostic    tolerance on numerics
#   topk      first N rows must match in order (first column key), N = topk
#   nonempty  at least one row returned
#
# ${placeholders} are filled from `values` below - align them with the
# value_sets you profiled / the synthetic generator's vocab. NEVER hard-code
# enums in the Cypher.
# ---------------------------------------------------------------------------
values:
  policy_active: active
  policy_cancelled: cancelled
  claim_open: open
  claim_rejected: rejected
  adj_approved: approved
  channel_broker: broker
  lob_motor: motor
  lob_health: health
  loss_ratio_full: 100        # loss_ratio decimal(5,2) stored as percent; use 1.0 if stored as ratio
  fraud_prob_high: 80         # fraud_probability is "%" in DDL; the user says 0.8 - set to 0.8 if stored as ratio
  journey_policy_number: CTM5DQ3K

defaults:
  tolerance: 0.01
  round_to: 2

questions:

# ============================ POLICY ============================
- id: Q01
  category: policy
  question: How many policies?
  compare: count
  expected_cypher: |
    MATCH (p:Policy) RETURN count(p) AS policies

- id: Q02
  category: policy
  question: How many active policies?
  compare: count
  expected_cypher: |
    MATCH (p:Policy {policyStatus:'${policy_active}'}) RETURN count(p) AS activePolicies

- id: Q03
  category: policy
  question: Policies by status
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)
    RETURN p.policyStatus AS status, count(p) AS policies
    ORDER BY policies DESC

- id: Q04
  category: policy
  question: Policies by line of business
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)
    RETURN p.lineOfBusiness AS lineOfBusiness, count(p) AS policies
    ORDER BY policies DESC

- id: Q05
  category: policy
  question: Top 10 insurers by number of policies
  compare: topk
  topk: 10
  expected_cypher: |
    MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer)
    RETURN i.nameEng AS insurer, count(p) AS policies
    ORDER BY policies DESC, insurer
    LIMIT 10

- id: Q06
  category: policy
  question: Gross written premium by insurer
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer),
          (p)-[:HAS_PREMIUM]->(pr:Premium {scope:'policy'})
    RETURN i.nameEng AS insurer, round(sum(pr.grossWrittenPremium), 2) AS gwp
    ORDER BY gwp DESC

- id: Q07
  category: policy
  question: Loss ratio by insurer
  note: Average of policy-level lossRatio. If the chat computes claims/premium instead, mark as accepted alternative.
  compare: rows
  tolerance: 0.5
  expected_cypher: |
    MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer)
    WHERE p.lossRatio IS NOT NULL
    RETURN i.nameEng AS insurer, round(avg(p.lossRatio), 2) AS avgLossRatio
    ORDER BY avgLossRatio DESC

- id: Q08
  category: policy
  question: Loss ratio by line of business
  compare: rows
  tolerance: 0.5
  expected_cypher: |
    MATCH (p:Policy)
    WHERE p.lossRatio IS NOT NULL
    RETURN p.lineOfBusiness AS lineOfBusiness, round(avg(p.lossRatio), 2) AS avgLossRatio
    ORDER BY avgLossRatio DESC

- id: Q09
  category: policy
  question: Policies with loss ratio over 100 percent
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)
    WHERE p.lossRatio > ${loss_ratio_full}
    RETURN p.policyNumber AS policyNumber, p.lossRatio AS lossRatio
    ORDER BY lossRatio DESC

- id: Q10
  category: policy
  question: Policies by distribution channel type
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[:SOLD_VIA]->(c:Channel)
    RETURN c.channelType AS channelType, count(p) AS policies
    ORDER BY policies DESC

- id: Q11
  category: policy
  question: Top brokers by premium
  compare: topk
  topk: 10
  expected_cypher: |
    MATCH (p:Policy)-[:SOLD_VIA]->(c:Channel {channelType:'${channel_broker}'}),
          (p)-[:HAS_PREMIUM]->(pr:Premium {scope:'policy'})
    RETURN c.nameEng AS broker, round(sum(pr.grossWrittenPremium), 2) AS gwp
    ORDER BY gwp DESC, broker
    LIMIT 10

- id: Q12
  category: policy
  question: Monthly policy trend
  compare: rows
  expected_cypher: |
    MATCH (p:Policy) WHERE p.issueDate IS NOT NULL
    RETURN p.issueDate.year AS year, p.issueDate.month AS month, count(p) AS policies
    ORDER BY year, month

- id: Q13
  category: policy
  question: Yearly policy trend
  compare: rows
  expected_cypher: |
    MATCH (p:Policy) WHERE p.issueDate IS NOT NULL
    RETURN p.issueDate.year AS year, count(p) AS policies
    ORDER BY year

- id: Q14
  category: policy
  question: Premium trend by quarter
  compare: rows
  expected_cypher: |
    MATCH (pr:Premium {scope:'policy'}) WHERE pr.effectiveDate IS NOT NULL
    RETURN pr.effectiveDate.year AS year, pr.effectiveDate.quarter AS quarter,
           round(sum(pr.grossWrittenPremium), 2) AS gwp
    ORDER BY year, quarter

- id: Q15
  category: policy
  question: Policy trend by insurer
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer) WHERE p.issueDate IS NOT NULL
    RETURN i.nameEng AS insurer, p.issueDate.year AS year, count(p) AS policies
    ORDER BY insurer, year

- id: Q16
  category: policy
  question: Policies expiring in the next 90 days
  note: Date-relative. Generate synthetic expiry dates relative to the run date or freeze the DB clock.
  compare: count
  expected_cypher: |
    MATCH (p:Policy)
    WHERE p.expiryDate >= date() AND p.expiryDate <= date() + duration({days:90})
    RETURN count(p) AS expiringSoon

- id: Q17
  category: policy
  question: Cancelled policies and their reasons
  compare: rows
  expected_cypher: |
    MATCH (p:Policy {policyStatus:'${policy_cancelled}'})
    RETURN p.cancellationReason AS reason, count(p) AS policies
    ORDER BY policies DESC

- id: Q18
  category: policy
  question: Policies that were renewed more than once
  note: Proves the derived RENEWED_AS chain. Origin policy = no incoming RENEWED_AS.
  compare: rows
  expected_cypher: |
    MATCH path = (origin:Policy)-[:RENEWED_AS*2..]->(:Policy)
    WHERE NOT ()-[:RENEWED_AS]->(origin)
    WITH origin, max(length(path)) AS renewals
    RETURN origin.policyNumber AS policyNumber, renewals
    ORDER BY renewals DESC, policyNumber

# ============================ CLAIMS ============================
- id: Q19
  category: claims
  question: How many claims?
  compare: count
  expected_cypher: |
    MATCH (c:Claim) RETURN count(c) AS claims

- id: Q20
  category: claims
  question: Claims by status
  compare: rows
  expected_cypher: |
    MATCH (c:Claim)
    RETURN c.claimStatus AS status, count(c) AS claims
    ORDER BY claims DESC

- id: Q21
  category: claims
  question: Open claims with outstanding amount
  compare: rows
  expected_cypher: |
    MATCH (c:Claim {claimStatus:'${claim_open}'})
    WHERE c.amountOutstanding > 0
    RETURN c.claimNumber AS claimNumber, c.amountOutstanding AS amountOutstanding
    ORDER BY amountOutstanding DESC

- id: Q22
  category: claims
  question: Monthly claim trend
  compare: rows
  expected_cypher: |
    MATCH (c:Claim) WHERE c.claimCreationDate IS NOT NULL
    RETURN c.claimCreationDate.year AS year, c.claimCreationDate.month AS month, count(c) AS claims
    ORDER BY year, month

- id: Q23
  category: claims
  question: Claims by insurer
  compare: rows
  expected_cypher: |
    MATCH (c:Claim)-[:AGAINST]->(:Coverage)<-[:HAS_COVERAGE]-(:Policy)-[:ISSUED_BY]->(i:Insurer)
    RETURN i.nameEng AS insurer, count(c) AS claims
    ORDER BY claims DESC

- id: Q24
  category: claims
  question: Average settlement days by insurer
  compare: rows
  tolerance: 0.5
  expected_cypher: |
    MATCH (c:Claim)-[:AGAINST]->(:Coverage)<-[:HAS_COVERAGE]-(:Policy)-[:ISSUED_BY]->(i:Insurer)
    WHERE c.claimResolutionDate IS NOT NULL AND c.claimCreationDate IS NOT NULL
    RETURN i.nameEng AS insurer,
           round(avg(duration.inDays(c.claimCreationDate, c.claimResolutionDate).days), 1) AS avgSettlementDays
    ORDER BY avgSettlementDays

- id: Q25
  category: claims
  question: Claim approval rate by product
  compare: rows
  expected_cypher: |
    MATCH (c:Claim)-[:AGAINST]->(:Coverage)-[:OF_PRODUCT]->(pr:CompanyProduct)
    WITH pr, count(c) AS total,
         sum(CASE WHEN c.adjudicationOutcome = '${adj_approved}' THEN 1 ELSE 0 END) AS approved
    RETURN pr.productName AS product, round(toFloat(approved) / total, 2) AS approvalRate
    ORDER BY approvalRate DESC

- id: Q26
  category: claims
  question: Rejected claims by reason
  compare: rows
  expected_cypher: |
    MATCH (c:Claim {claimStatus:'${claim_rejected}'})
    RETURN c.rejectionReason AS reason, count(c) AS claims
    ORDER BY claims DESC

- id: Q27
  category: fraud
  question: How many fraud-flagged claims?
  compare: count
  expected_cypher: |
    MATCH (c:Claim {fraudSuspicionIndicator:true}) RETURN count(c) AS fraudFlagged

- id: Q28
  category: fraud
  question: Fraud-flagged claims by insurer
  compare: rows
  expected_cypher: |
    MATCH (c:Claim {fraudSuspicionIndicator:true})-[:AGAINST]->(:Coverage)<-[:HAS_COVERAGE]-(:Policy)-[:ISSUED_BY]->(i:Insurer)
    RETURN i.nameEng AS insurer, count(c) AS fraudFlagged
    ORDER BY fraudFlagged DESC

- id: Q29
  category: fraud
  question: Claims with fraud probability above 0.8
  compare: rows
  expected_cypher: |
    MATCH (c:Claim)
    WHERE c.fraudProbability > ${fraud_prob_high}
    RETURN c.claimNumber AS claimNumber, c.fraudProbability AS fraudProbability
    ORDER BY fraudProbability DESC

- id: Q30
  category: fraud
  question: Policyholders with the most fraud-flagged motor claims
  compare: topk
  topk: 10
  expected_cypher: |
    MATCH (ph)-[:HOLDS]->(cov:Coverage)<-[:AGAINST]-(c:Claim {fraudSuspicionIndicator:true}),
          (cov)<-[:HAS_COVERAGE]-(:Policy {lineOfBusiness:'${lob_motor}'})
    WHERE ph:Person OR ph:Organization
    RETURN coalesce(ph.fullName, ph.nameEng) AS policyholder, count(c) AS fraudFlaggedMotorClaims
    ORDER BY fraudFlaggedMotorClaims DESC, policyholder
    LIMIT 10

- id: Q31
  category: claims
  question: Claims with no policy
  note: Model-integrity test - must be 0 in v2 (every Claim has AGAINST->Coverage<-HAS_COVERAGE-Policy).
  compare: count
  expected_cypher: |
    MATCH (c:Claim)
    WHERE NOT (c)-[:AGAINST]->(:Coverage)<-[:HAS_COVERAGE]-(:Policy)
    RETURN count(c) AS orphanClaims

- id: Q32
  category: claims
  question: Top 10 policies by claims paid
  compare: topk
  topk: 10
  expected_cypher: |
    MATCH (p:Policy)-[:HAS_COVERAGE]->(:Coverage)<-[:AGAINST]-(c:Claim)
    RETURN p.policyNumber AS policyNumber, round(sum(c.amountPaid), 2) AS claimsPaid
    ORDER BY claimsPaid DESC, policyNumber
    LIMIT 10

- id: Q33
  category: claims
  question: Policies with more than 5 claims
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[:HAS_COVERAGE]->(:Coverage)<-[:AGAINST]-(c:Claim)
    WITH p, count(c) AS claims
    WHERE claims > 5
    RETURN p.policyNumber AS policyNumber, claims
    ORDER BY claims DESC, policyNumber

- id: Q34
  category: journey
  question: Show me the journey of policy ${journey_policy_number}
  note: Requires a fixed seed in the synthetic generator so this policy number exists.
  compare: nonempty
  expected_cypher: |
    MATCH (p:Policy {policyNumber:'${journey_policy_number}'})
    OPTIONAL MATCH (p)-[:HAS_EVENT]->(e:Event)
    OPTIONAL MATCH (p)-[:HAS_COVERAGE]->(:Coverage)<-[:AGAINST]-(c:Claim)
    OPTIONAL MATCH (p)-[:RENEWED_AS]->(r:Policy)
    RETURN p.policyNumber AS policyNumber, p.issueDate AS issued, p.policyStatus AS status,
           collect(DISTINCT {date: e.eventDate, type: e.eventType}) AS events,
           collect(DISTINCT {claim: c.claimNumber, date: c.claimCreationDate, status: c.claimStatus}) AS claims,
           collect(DISTINCT r.policyNumber) AS renewedAs

# ============================ MOTOR ============================
- id: Q35
  category: motor
  question: How many vehicles are insured?
  compare: count
  expected_cypher: |
    MATCH (v:Vehicle)<-[:INSURES]-(:Coverage)
    WHERE coalesce(v.isStub, false) = false
    RETURN count(DISTINCT v) AS insuredVehicles

- id: Q36
  category: motor
  question: Vehicles by manufacturer
  compare: rows
  expected_cypher: |
    MATCH (v:Vehicle)<-[:INSURES]-(:Coverage)
    WHERE coalesce(v.isStub, false) = false
    RETURN v.manufacturer AS manufacturer, count(DISTINCT v) AS vehicles
    ORDER BY vehicles DESC

- id: Q37
  category: motor
  question: How many electric vehicles are insured?
  compare: count
  expected_cypher: |
    MATCH (v:Vehicle {isEv:true})<-[:INSURES]-(:Coverage)
    RETURN count(DISTINCT v) AS electricVehicles

- id: Q38
  category: motor
  question: Vehicles with AI assisted driving by insurer
  compare: rows
  expected_cypher: |
    MATCH (v:Vehicle {aiAssistedDriving:true})<-[:INSURES]-(:Coverage)<-[:HAS_COVERAGE]-(:Policy)-[:ISSUED_BY]->(i:Insurer)
    RETURN i.nameEng AS insurer, count(DISTINCT v) AS vehicles
    ORDER BY vehicles DESC

- id: Q39
  category: motor
  question: Accidents by city
  compare: rows
  expected_cypher: |
    MATCH (a:Accident)-[:OCCURRED_IN]->(c:City)
    RETURN c.name AS city, count(a) AS accidents
    ORDER BY accidents DESC

- id: Q40
  category: motor
  question: Accidents with fatalities
  compare: rows
  expected_cypher: |
    MATCH (a:Accident)
    WHERE a.fatalityCount > 0
    RETURN a.caseNumber AS caseNumber, a.accidentDatetime AS accidentDatetime, a.fatalityCount AS fatalities
    ORDER BY fatalities DESC, caseNumber

- id: Q41
  category: motor
  question: Total repair cost by damage type
  compare: rows
  expected_cypher: |
    MATCH (d:DamageAssessment)
    RETURN d.damageType AS damageType, round(sum(d.totalCostWithVat), 2) AS totalRepairCost
    ORDER BY totalRepairCost DESC

- id: Q42
  category: motor
  question: Claims with highest estimated repair cost
  compare: topk
  topk: 10
  expected_cypher: |
    MATCH (c:Claim)-[:RESULTED_FROM]->(:Accident)-[:ASSESSED_BY]->(d:DamageAssessment)
    RETURN c.claimNumber AS claimNumber, round(sum(d.totalCostWithVat), 2) AS repairCost
    ORDER BY repairCost DESC, claimNumber
    LIMIT 10

- id: Q43
  category: motor
  question: Policyholders with vehicles insured at more than one insurer
  note: Proves identity resolution - only works if Person/Organization are merged on personKey/orgKey.
  compare: rows
  expected_cypher: |
    MATCH (ph)-[:OWNS]->(:Vehicle)<-[:INSURES]-(:Coverage)<-[:HAS_COVERAGE]-(:Policy)-[:ISSUED_BY]->(i:Insurer)
    WHERE ph:Person OR ph:Organization
    WITH ph, count(DISTINCT i) AS insurers
    WHERE insurers > 1
    RETURN coalesce(ph.fullName, ph.nameEng) AS policyholder, insurers
    ORDER BY insurers DESC, policyholder

# ============================ HEALTH ============================
- id: Q44
  category: health
  question: How many health members?
  compare: count
  expected_cypher: |
    MATCH (m:Person)-[:ENROLLED_IN]->(:Coverage)
    RETURN count(DISTINCT m) AS healthMembers

- id: Q45
  category: health
  question: Health members by benefit class
  compare: rows
  expected_cypher: |
    MATCH (m:Person)-[:IN_CLASS]->(c:Class)
    RETURN c.className AS class, count(DISTINCT m) AS members
    ORDER BY members DESC

- id: Q46
  category: health
  question: Members by relationship to primary
  compare: rows
  expected_cypher: |
    MATCH (:Person)-[r:DEPENDENT_OF]->(:Person)
    RETURN r.relationship AS relationship, count(r) AS members
    ORDER BY members DESC

- id: Q47
  category: health
  question: Average member age by insurer
  compare: rows
  tolerance: 0.5
  expected_cypher: |
    MATCH (m:Person)-[:ENROLLED_IN]->(:Coverage)<-[:HAS_COVERAGE]-(:Policy)-[:ISSUED_BY]->(i:Insurer)
    WHERE m.age IS NOT NULL
    RETURN i.nameEng AS insurer, round(avg(m.age), 1) AS avgAge
    ORDER BY avgAge DESC

- id: Q48
  category: health
  question: Members older than 60
  compare: count
  expected_cypher: |
    MATCH (m:Person)-[:ENROLLED_IN]->(:Coverage)
    WHERE m.age > 60
    RETURN count(DISTINCT m) AS membersOver60

- id: Q49
  category: health
  question: Organisations sponsoring the most health members
  compare: topk
  topk: 10
  expected_cypher: |
    MATCH (m:Person)-[:EMPLOYED_BY]->(o:Organization)
    RETURN o.nameEng AS organisation, count(DISTINCT m) AS members
    ORDER BY members DESC, organisation
    LIMIT 10

- id: Q50
  category: health
  question: Top diagnosis codes by claim count
  compare: topk
  topk: 10
  expected_cypher: |
    MATCH (c:Claim)-[:HAS_LINE]->(:ClaimLine)-[:DIAGNOSED_WITH {role:'principal'}]->(d:DiagnosisCode)
    RETURN d.code AS diagnosisCode, count(DISTINCT c) AS claims
    ORDER BY claims DESC, diagnosisCode
    LIMIT 10

- id: Q51
  category: health
  question: Health claims cost split between patient and payer
  compare: value
  expected_cypher: |
    MATCH (:Claim)-[:HAS_LINE]->(l:ClaimLine)
    RETURN round(sum(l.patientShareAmount), 2) AS patientShare,
           round(sum(l.payerShareAmount), 2) AS payerShare

- id: Q52
  category: health
  question: Pre-authorization approval rate by status
  compare: rows
  expected_cypher: |
    MATCH (pa:PreAuthorization)
    WITH pa.status AS status, count(pa) AS total,
         sum(CASE WHEN pa.adjudicationOutcome = '${adj_approved}' THEN 1 ELSE 0 END) AS approved
    RETURN status, total, round(toFloat(approved) / total, 2) AS approvalRate
    ORDER BY total DESC

# ============================ PRODUCTS ============================
- id: Q53
  category: products
  question: Products by IA product
  compare: rows
  expected_cypher: |
    MATCH (cp:CompanyProduct)-[:APPROVED_AS]->(ap:AuthorityProduct)
    RETURN ap.productName AS iaProduct, count(cp) AS companyProducts
    ORDER BY companyProducts DESC

- id: Q54
  category: products
  question: Policies per IA product
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[:HAS_COVERAGE]->(:Coverage)-[:OF_PRODUCT]->(:CompanyProduct)-[:APPROVED_AS]->(ap:AuthorityProduct)
    RETURN ap.productName AS iaProduct, count(DISTINCT p) AS policies
    ORDER BY policies DESC

- id: Q55
  category: products
  question: Inactive products still attached to active policies
  compare: rows
  expected_cypher: |
    MATCH (p:Policy {policyStatus:'${policy_active}'})-[:HAS_COVERAGE]->(:Coverage)-[:OF_PRODUCT]->(cp:CompanyProduct)-[r:APPROVED_AS]->(ap:AuthorityProduct)
    WHERE r.isActive = false
    RETURN cp.productName AS companyProduct, ap.productName AS iaProduct, count(DISTINCT p) AS activePolicies
    ORDER BY activePolicies DESC

# ============================ REINSURANCE ============================
- id: Q56
  category: reinsurance
  question: Reinsurers by number of policies reinsured
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[:REINSURED_BY]->(r:Reinsurer)
    RETURN r.nameEng AS reinsurer, count(DISTINCT p) AS policies
    ORDER BY policies DESC

- id: Q57
  category: reinsurance
  question: Average quota share by reinsurer
  compare: rows
  tolerance: 0.5
  expected_cypher: |
    MATCH (:Policy)-[x:REINSURED_BY]->(r:Reinsurer)
    WHERE x.quotaSharePercentage IS NOT NULL
    RETURN r.nameEng AS reinsurer, round(avg(x.quotaSharePercentage), 2) AS avgQuotaShare
    ORDER BY avgQuotaShare DESC

- id: Q58
  category: reinsurance
  question: Reinsured policies by agreement type
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[x:REINSURED_BY]->(:Reinsurer)
    RETURN x.agreementType AS agreementType, count(DISTINCT p) AS policies
    ORDER BY policies DESC

# ============================ MARKET / DISTRIBUTION ============================
- id: Q59
  category: market
  question: Agents per distribution channel
  compare: rows
  expected_cypher: |
    MATCH (a:Agent)-[:WORKS_FOR]->(c:Channel)
    RETURN c.nameEng AS channel, count(a) AS agents
    ORDER BY agents DESC

- id: Q60
  category: policy
  question: Policy events by type
  compare: rows
  expected_cypher: |
    MATCH (:Policy)-[:HAS_EVENT]->(e:Event)
    RETURN e.eventType AS eventType, count(e) AS events
    ORDER BY events DESC

- id: Q61
  category: market
  question: Insurers by saudization percentage
  compare: rows
  tolerance: 0.2
  expected_cypher: |
    MATCH (i:Insurer)
    WHERE i.employeeCount > 0
    RETURN i.nameEng AS insurer,
           round(100.0 * i.saudiEmployeeCount / i.employeeCount, 1) AS saudizationPct
    ORDER BY saudizationPct DESC

- id: Q62
  category: market
  question: Local versus foreign insurers by premium
  compare: rows
  expected_cypher: |
    MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer),
          (p)-[:HAS_PREMIUM]->(pr:Premium {scope:'policy'})
    RETURN CASE WHEN i.isLocal THEN 'local' ELSE 'foreign' END AS origin,
           round(sum(pr.grossWrittenPremium), 2) AS gwp
    ORDER BY gwp DESC

- id: Q63
  category: claims
  question: Claims by claimant type
  compare: rows
  expected_cypher: |
    MATCH (x)-[f:FILED]->(c:Claim)
    RETURN coalesce(f.claimantType, labels(x)[0]) AS claimantType, count(c) AS claims
    ORDER BY claims DESC

- id: Q64
  category: claims
  question: Claims filed within 30 days of policy start
  compare: count
  expected_cypher: |
    MATCH (c:Claim)-[:AGAINST]->(:Coverage)<-[:HAS_COVERAGE]-(p:Policy)
    WHERE c.claimCreationDate IS NOT NULL AND p.effectDate IS NOT NULL
      AND date(c.claimCreationDate) >= p.effectDate
      AND date(c.claimCreationDate) <= p.effectDate + duration({days:30})
    RETURN count(c) AS earlyClaims
