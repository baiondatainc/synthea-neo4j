- id: Q05
  category: policy
  question: Top 10 insurers by number of policies
  compare: topk
  expected_cypher: 'MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer)

    RETURN i.name AS insurer, count(p) AS policy_count ORDER BY policy_count DESC, insurer LIMIT 10'
  topk: 10
- id: Q06
  category: policy
  question: Gross written premium by insurer
  compare: rows
  expected_cypher: 'MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer)

    RETURN i.name AS insurer, round(sum(p.gross_written_premium), 2) AS gwp ORDER BY gwp DESC'
- id: Q07
  category: policy
  question: Loss ratio by insurer
  compare: rows
  expected_cypher: 'MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer)

    WITH i.name AS insurer, sum(p.total_paid) AS paid, sum(p.gross_written_premium) AS gwp

    WHERE gwp > 0

    RETURN insurer, round(paid * 100.0 / gwp, 2) AS loss_ratio_pct ORDER BY loss_ratio_pct DESC'
  tolerance: 0.5
  note: 'premium-weighted: sum(total_paid)/sum(gwp) per insurer, matching mart_insurer_monthly_kpi. NEVER avg(calculated_loss_ratio_pct)
    at group level - one tiny-premium policy distorts the mean (avg-of-ratios vs ratio-of-sums)'
- id: Q08
  category: policy
  question: Loss ratio by line of business
  compare: rows
  expected_cypher: 'MATCH (p:Policy)

    WITH p.line_of_business AS line_of_business, sum(p.total_paid) AS paid, sum(p.gross_written_premium) AS gwp

    WHERE gwp > 0

    RETURN line_of_business, round(paid * 100.0 / gwp, 2) AS loss_ratio_pct ORDER BY loss_ratio_pct DESC'
  tolerance: 0.5
  note: premium-weighted, same rule as Q07
- id: Q09
  category: policy
  question: Policies with loss ratio over 100 percent
  compare: rows
  expected_cypher: 'MATCH (p:Policy) WHERE p.calculated_loss_ratio_pct > ${loss_ratio_full}

    RETURN p.policy_number AS policy_number, p.calculated_loss_ratio_pct AS loss_ratio_pct ORDER BY loss_ratio_pct DESC'
  note: per-policy filter - the ONE legitimate use of calculated_loss_ratio_pct
