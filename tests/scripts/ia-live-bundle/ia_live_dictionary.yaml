- type: HAS_EVENT
  from: Policy
  to: PolicyEvent
- type: REGULATED_AS
  from: Product
  to: IAProduct
- type: WORKS_FOR
  from: Agent
  to: DistributionChannel
- type: COVERED_BY
  from: HealthMember
  to: Policy
- type: SPONSORED_BY
  from: HealthMember
  to: Policyholder
