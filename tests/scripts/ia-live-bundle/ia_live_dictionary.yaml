common_paths:
- name: Q07
  question: Loss ratio by insurer
  cypher: 'MATCH (p:Policy)-[:ISSUED_BY]->(i:Insurer)

    WITH i.name AS insurer, sum(p.total_paid) AS paid, sum(p.gross_written_premium) AS gwp

    WHERE gwp > 0

    RETURN insurer, round(paid * 100.0 / gwp, 2) AS loss_ratio_pct ORDER BY loss_ratio_pct DESC'
- name: Q23
  question: Claims by insurer
  cypher: 'MATCH (c:Claim)-[:UNDER_POLICY]->(:Policy)-[:ISSUED_BY]->(i:Insurer)

    RETURN i.name AS insurer, count(c) AS claim_count ORDER BY claim_count DESC'
- name: Q30
  question: Policyholders with the most fraud-flagged motor claims
  cypher: 'MATCH (c:Claim)-[:UNDER_POLICY]->(p:Policy)<-[:INSURED_UNDER]-(v:Vehicle)-[:OWNED_BY]->(ph:Policyholder)

    WHERE c.fraud_suspicion_indicator = true AND p.line_of_business = ''${lob_motor}''

    RETURN ph.name AS policyholder, count(DISTINCT c) AS fraud_flagged_motor_claims

    ORDER BY fraud_flagged_motor_claims DESC, policyholder LIMIT 10'
- name: Q34
  question: Show me the journey of policy ${journey_policy_number}
  cypher: "MATCH (p:Policy {policy_number: '${journey_policy_number}'})\nOPTIONAL MATCH (p)-[:HAS_EVENT]->(e:PolicyEvent)\n\
    OPTIONAL MATCH (c:Claim)-[:UNDER_POLICY]->(p)\nRETURN p.policy_number AS policy_number, p.issue_date AS issued, p.policy_status\
    \ AS status,\n       collect(DISTINCT {date: e.event_date, type: e.event_type}) AS events,\n       collect(DISTINCT {claim:\
    \ c.claim_number, date: c.claim_creation_date, status: c.claim_status}) AS claims"
- name: Q43
  question: Policyholders with vehicles insured at more than one insurer
  cypher: 'MATCH (ph:Policyholder)<-[:OWNED_BY]-(:Vehicle)-[:INSURED_UNDER]->(:Policy)-[:ISSUED_BY]->(i:Insurer)

    WITH ph, count(DISTINCT i) AS insurer_count WHERE insurer_count > 1

    RETURN ph.name AS policyholder, insurer_count ORDER BY insurer_count DESC, policyholder'
- name: Q49
  question: Organisations sponsoring the most health members
  cypher: 'MATCH (m:HealthMember)-[:SPONSORED_BY]->(ph:Policyholder)

    RETURN ph.name AS organisation, count(m) AS member_count ORDER BY member_count DESC, organisation LIMIT 10'
- name: Q50
  question: Top diagnosis codes by claim count
  cypher: 'MATCH (c:Claim)-[:HAS_SERVICE_LINE]->(:HealthClaimLine)-[:DIAGNOSED_WITH]->(d:DiagnosisCode)

    RETURN d.code AS diagnosis, count(DISTINCT c) AS claim_count ORDER BY claim_count DESC, diagnosis LIMIT 10'
- name: Q52
  question: Pre-authorization approval rate by status
  cypher: "MATCH (pa:PreAuthorization)\nWITH pa.pre_authorization_status AS status, count(pa) AS total,\n     sum(CASE WHEN\
    \ pa.adjudication_outcome = '${adj_approved}' THEN 1 ELSE 0 END) AS approved\nRETURN status, total, round(toFloat(approved)\
    \ / total, 2) AS approval_rate ORDER BY total DESC"
- name: Q55
  question: Inactive products still attached to active policies
  cypher: 'MATCH (p:Policy)-[:HAS_PRODUCT]->(pr:Product) WHERE p.is_active = true AND pr.is_active = false

    RETURN pr.name AS product, count(DISTINCT p) AS active_policies ORDER BY active_policies DESC, product'
