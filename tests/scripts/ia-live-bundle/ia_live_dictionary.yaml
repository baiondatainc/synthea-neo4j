      is_p_c: Boolean
      is_p_s: Boolean
      lines_of_business: String
      employee_count: Long
      saudization_pct: Double
      number_of_branches: Long
    rollups:
    - saudization_pct
    - lines_of_business
    relationships_out: []
    relationships_in:
    - <-[:ISSUED_BY]-(:Policy)
  Reinsurer:
    description: Reinsurance company.
    key: reinsurer_id
    properties:
      reinsurer_id: String
      ia_id: String
