catalog:
  name: IA Insurance Knowledge Graph (live)
  version: live-1.1
  generated: '2026-09-22'
  source: db.schema dump of bolt://localhost:7687
schema_notes:
  rollups: Policy and Claim carry precomputed rollups (claim_count, total_paid, settlement_days, days_into_policy, ...). Use
    the flat property for policy-level or claim-level totals; traverse only for per-entity breakdowns.
  loss_ratio: calculated_loss_ratio_pct is PER-POLICY only (filter/inspect single policies). Any group-level loss ratio (by
    insurer/LoB/channel/region) = sum(total_paid) * 100.0 / sum(gross_written_premium) with a gwp > 0 guard - never avg the
    per-policy pct (one tiny-premium policy distorts the mean). This matches mart_insurer_monthly_kpi.
  claims_to_insurer: (Claim)-[:UNDER_POLICY]->(Policy)-[:ISSUED_BY]->(Insurer). ~10% of claims have no UNDER_POLICY edge.
  pre_auth: PreAuthorization is reachable ONLY through (Claim)-[:HAS_PRE_AUTH]->; there is no policy edge on it.
  policyholder: 'One Policyholder label for individuals and organisations (policyholder_type). Motor policyholders: (Vehicle)-[:OWNED_BY]->(Policyholder).
    Health sponsors: (HealthMember)-[:SPONSORED_BY]->(Policyholder).'
  dates: DateTime properties use dot notation (p.issue_date.year) and compare with datetime(). Date properties (HealthMember.date_of_birth,
    Product.approval_date/end_date) compare with date().
  geography: No City/Region nodes - city/region are string properties on Insurer, DistributionChannel, Policyholder, HealthMember,
    Accident, DamageAssessment.center_city.
  value_sets: Statuses/enums are NOT enumerated here. Profile with SELECT DISTINCT before injecting into the prompt.
  not_modelled: Premium is a Policy property (gross_written_premium), not a node. No SparePart, Contract, Membership, HCPNetwork,
    HealthcareProvider labels in this load.
node_labels:
  Policy:
    description: Insurance policy - the anchor node. Carries premium, loss-ratio and claim ROLLUPS.
    key: policy_id (surrogate); policy_number is the business key
    properties:
      policy_id: String
      policy_number: String
      policy_type: String
      main_type: String
      general_line_of_business: String
      line_of_business: String
      policy_status: String
      is_active: Boolean
      is_cancelled: Boolean
      is_reinsured: Boolean
      is_direct: Boolean
      issue_date: DateTime
      effect_date: DateTime
      renewal_date: DateTime
      expiry_date: DateTime
      cancellation_date: DateTime
      cancellation_reason: String
      policy_term_days: Long
      effect_year: Long
      effect_month: String
      gross_written_premium: Double
      net_written_premium: Double
      commission: Double
      reported_loss_ratio: Double
      calculated_loss_ratio_pct: Double
      product_count: Long
      event_count: Long
      last_event_type: String
      renewal_count: Long
      claim_count: Long
      open_claim_count: Long
      fraud_flagged_claim_count: Long
      max_fraud_probability: Double
      total_claimed: Double
      total_approved: Double
      total_paid: Double
      total_outstanding: Double
      avg_settlement_days: Double
      vehicle_count: Long
      health_member_count: Long
      reinsurance_agreement_count: Long
    rollups:
    - claim_count
    - open_claim_count
    - fraud_flagged_claim_count
    - total_claimed
    - total_approved
    - total_paid
    - total_outstanding
    - avg_settlement_days
    - renewal_count
    - event_count
    - vehicle_count
    - health_member_count
    - calculated_loss_ratio_pct
    relationships_out:
    - -[:ISSUED_BY]->(:Insurer)
    - -[:SOLD_VIA]->(:DistributionChannel)
    - -[:HAS_PRODUCT]->(:Product)
    - -[:REINSURED_BY]->(:Reinsurer)
    - -[:HAS_EVENT]->(:PolicyEvent)
    relationships_in:
    - <-[:COVERED_BY]-(:HealthMember)
    - <-[:INSURED_UNDER]-(:Vehicle)
    - <-[:UNDER_POLICY]-(:Claim)
  Insurer:
    description: Licensed insurance company.
    key: insurer_id; ia_id is the IA licence
    properties:
