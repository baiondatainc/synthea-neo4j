  Policy.policy_status: PROFILE
  Policy.line_of_business: PROFILE
  Policy.policy_type: PROFILE
  Claim.claim_status: PROFILE
  Claim.adjudication_outcome: PROFILE
  Claim.claim_lob: PROFILE
  PreAuthorization.pre_authorization_status: PROFILE
  DistributionChannel.channel_type: PROFILE
  Policyholder.policyholder_type: PROFILE
  Vehicle.coverage_type: PROFILE
  PolicyEvent.event_type: PROFILE
