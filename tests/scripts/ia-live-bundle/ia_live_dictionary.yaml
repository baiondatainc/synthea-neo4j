- type: IN_CLASS
  from: HealthMember
  to: BenefitClass
- type: INSURED_UNDER
  from: Vehicle
  to: Policy
- type: OWNED_BY
  from: Vehicle
  to: Policyholder
- type: UNDER_POLICY
  from: Claim
  to: Policy
  properties:
    policy_product_id: Long
  note: ~10% of claims have no policy edge
- type: FOR_PRODUCT
  from: Claim
  to: Product
- type: FILED_BY
  from: Claim
  to: Claimant
- type: HAS_PRE_AUTH
  from: Claim
  to: PreAuthorization
- type: HAS_SERVICE_LINE
  from: Claim
