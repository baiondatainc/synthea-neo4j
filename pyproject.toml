[project]
name = "synthea-neo4j-kg"
version = "0.1.0"
description = "Synthea Healthcare Knowledge Graph with Neo4j Aura + LangChain RAG + WebSocket QA"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=1.1.0",
    "langchain-neo4j>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0",
    "redis>=5.0,<6",
    "duckdb>=1.5.4",
    "scikit-learn>=1.3.0",
    "asyncpg>=0.31.0",
    # Runtime embeddings — pulls torch (CPU wheel via [tool.uv.sources]).
    # Remove this line if embeddings are served by Ollama/API instead.
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
# Fine-tuning only — never installed in the serving container.
# Install locally with: uv sync --extra lora
lora = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.8.0",
    "trl>=0.7.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.42.0",
    "datasets>=2.14.0",
    "sentencepiece>=0.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "rich>=13.0.0",
    "jupyterlab>=4.5.8",
    # LoRA training tools
    "unsloth[colab-new] @ git+https://github.com/unslothai/unsloth.git",
    "transformers>=4.40.0",
    "peft>=0.8.0",
    "trl>=0.7.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.42.0",
    "datasets>=2.14.0",
    "sentencepiece>=0.2.0",
]

# Force CPU-only torch everywhere torch is installed without the lora extra.
# NOTE: if you train on this same machine with a GPU, run training in a
# separate venv/project, or remove this pin when doing `uv sync --extra lora`.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "graph", "ingest", "qa", "metadata", "guardrails", "memory", "cache"]
include = ["README.md", "main.py", "config.py"]